<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zi Wang — Portfolio (v2 · Focus)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
body{font-family:'Inter Tight',sans-serif}

/* ---------- hero: giant name, letters come into focus and gain weight near the cursor ---------- */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:68px var(--pad) 0}
.hero h1{margin-top:clamp(10px,3vh,40px);font-size:clamp(70px,21.4vw,420px);line-height:.86;letter-spacing:-.045em;white-space:nowrap;display:flex;justify-content:space-between;cursor:default;user-select:none}
.hero h1 span{display:inline-block;font-variation-settings:'wght' var(--wg,220);filter:blur(22px);opacity:0;transform:translateY(.08em);
  animation:focus 1.5s var(--ease) forwards;animation-delay:calc(var(--i)*110ms + 150ms);will-change:font-variation-settings}
.hero h1 span.gap{width:.18em}
@keyframes focus{to{filter:blur(0);opacity:1;transform:none}}
.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;font-size:14px;padding:18px 0 22px;align-items:center;opacity:0;animation:fadeIn 1s ease 1.2s forwards}
.meta div:nth-child(2){text-align:center}.meta div:nth-child(3){text-align:right}
.roles{display:inline-block;height:1.5em;overflow:hidden;vertical-align:bottom}
.roles b{display:block;font-weight:500;animation:roll 6s var(--ease) infinite}
@keyframes roll{0%,40%{transform:translateY(0)}50%,90%{transform:translateY(-1.5em)}100%{transform:translateY(-3em)}}
.intro{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(24px,5vw,90px);align-items:end;padding:clamp(24px,5vh,60px) 0}
.intro p{font-size:clamp(22px,2.6vw,40px);font-weight:400;letter-spacing:-.025em;line-height:1.18;max-width:17ch}
.intro .peek{position:relative;aspect-ratio:16/8.5;overflow:hidden;border-radius:14px;box-shadow:var(--shadow-up);clip-path:inset(100% 0 0 0);animation:wipe 1.4s var(--ease) 1.1s forwards}
@keyframes wipe{to{clip-path:inset(0)}}
.intro .peek img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transform:scale(1.08);transition:opacity 1.1s ease,transform 5s linear}
.intro .peek img.on{opacity:1;transform:scale(1)}

/* ---------- recent project ---------- */
.recent{padding-top:clamp(80px,10vw,150px)}
.recent .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:clamp(24px,4vw,70px);align-items:end}
.recent .ph{aspect-ratio:16/10}
.recent h2{font-weight:500;font-size:clamp(48px,7vw,116px);letter-spacing:-.05em;line-height:.95;margin:18px 0 10px}
.recent p{color:#3d3d44;line-height:1.65;margin:18px 0 24px;max-width:46ch}

/* ---------- projects: indexed two-column grid ---------- */
.work{padding-top:clamp(80px,10vw,150px)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:13.5px;font-weight:500;background:var(--chip);border:0;padding:9px 15px;border-radius:999px;color:#45454d;cursor:pointer;transition:background .25s,color .25s}
.tabs button sup{font-size:10px;margin-left:4px;opacity:.6}
.tabs button:hover{background:#e7e7ec}
.tabs button.on{background:var(--ink);color:#fff}
#rows{display:grid;grid-template-columns:1fr 1fr;gap:clamp(44px,5vw,80px) clamp(20px,2.6vw,44px)}
.item{display:flex;flex-direction:column}
.item.hide{display:none}
.item .no{order:-1;margin-bottom:10px;font-size:12.5px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.item .ph{aspect-ratio:16/10.5}
.item h4{font-size:clamp(22px,2.1vw,32px);letter-spacing:-.035em;line-height:1.12}
.item .desc{font-size:15px}
@media (max-width:760px){#rows{grid-template-columns:1fr}.intro,.recent .grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.meta div:nth-child(2){display:none}}
</style>
</head>
<body>
<header id="nav"></header>

<section class="hero">
  <h1 id="h1" aria-label="Zi Wang"></h1>
  <div>
    <div class="intro">
      <p class="rvx"><span class="ln" style="--n:5"><span>A visual designer</span></span><span class="ln" style="--n:6"><span>and UI &amp; UX designer.</span></span></p>
      <div class="peek" id="peek"></div>
    </div>
    <div class="meta"><div><span class="badge">Portfolio</span></div><div><span class="roles"><b>Visual Design</b><b>UI &amp; UX Design</b><b>Visual Design</b></span></div><div><a class="ul" href="#featured">Scroll ↓</a></div></div>
  </div>
</section>

<section class="recent wrap" id="featured">
  <div class="grid">
    <a class="rv" id="f-a"><div class="ph"><img id="f-img" alt=""></div></a>
    <div class="rv" style="--d:120ms"><span class="badge"><i></i><span id="f-badge"></span></span><h2 id="f-title"></h2><span class="lbl" id="f-sub"></span><p id="f-desc"></p><a class="more" id="f-b">View project <b>→</b></a></div>
  </div>
</section>

<section class="work wrap" id="work">
  <div class="sec-h rv"><h2>Projects</h2><div class="tabs" id="tabs"></div></div>
  <div id="rows"></div>
</section>
<div id="exp" class="wrap"></div>
<footer id="footer"></footer>

<script src="shared.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)}, F=PF.featured;
  PF.chrome();
  $('#f-badge').textContent=F.badge; $('#f-img').src=F.img; $('#f-title').textContent=F.title; $('#f-sub').textContent=F.sub; $('#f-desc').textContent=F.desc; $('#f-a').href=$('#f-b').href=F.href;

  /* hero letters */
  var h1=$('#h1'); h1.innerHTML='ZI WANG'.split('').map(function(c,i){return c===' '?'<span class="gap" style="--i:'+i+'"></span>':'<span style="--i:'+i+'" aria-hidden="true">'+c+'</span>'}).join('');
  var letters=[].slice.call(h1.querySelectorAll('span:not(.gap)')), mx=-9999,my=-9999, cur=letters.map(function(){return 220});
  addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY},{passive:true});
  h1.addEventListener('mouseleave',function(){mx=my=-9999});
  /* cycling peek image in the hero */
  var covers=PF.covers(8), peek=$('#peek'), pi=0;
  peek.innerHTML=covers.map(function(p,i){return '<img src="'+p.img+'" alt="" class="'+(i?'':'on')+'">'}).join('');
  setInterval(function(){var im=peek.children;im[pi].classList.remove('on');pi=(pi+1)%im.length;im[pi].classList.add('on')},2600);

  $('#tabs').innerHTML='<button class="on" data-f="all">All<sup>'+PF.projects.length+'</sup></button>'+PF.cats.map(function(c){return '<button data-f="'+c.id+'">'+PF.esc(c.short)+'<sup>'+PF.byCat(c.id).length+'</sup></button>'}).join('');
  $('#rows').innerHTML=PF.projects.map(function(p,i){return PF.item(p,i%2).replace('class="item','data-c="'+p.cat+'" class="item').replace(/<\/a>$/,'<span class="no">'+String(i+1).padStart(2,'0')+'</span></a>')}).join('');
  PF.reveal('.rv');
  var rows=[].slice.call(document.querySelectorAll('#rows .item'));
  $('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});var n=0;
    rows.forEach(function(r){var show=b.dataset.f==='all'||r.dataset.c===b.dataset.f;r.classList.toggle('hide',!show);if(show){r.querySelector('.no').textContent=String(++n).padStart(2,'0');r.classList.add('in')}})});

  /* weight follows the cursor (variable font) */
  if(!PF.reduced)(function tick(){
    letters.forEach(function(l,i){var r=l.getBoundingClientRect(),d=Math.hypot(mx-(r.left+r.width/2),my-(r.top+r.height/2)),
      t=220+680*Math.max(0,1-d/(innerWidth*.34)); cur[i]+=(t-cur[i])*.12; l.style.setProperty('--wg',cur[i].toFixed(0))});
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
