<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zi Wang — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">
<style>
body{font-family:'Red Hat Display',sans-serif}

/* ---------- hero: covers are dealt onto a huge wheel that keeps turning ---------- */
.hero{position:relative;height:100svh;min-height:660px;overflow:hidden;text-align:center;padding:clamp(104px,14vh,150px) var(--pad) 0}
.hero .badge{opacity:0;transform:translateY(10px);animation:pop .9s var(--ease) .1s forwards}
@keyframes pop{to{opacity:1;transform:none}}
.hero h1{font-weight:600;font-size:clamp(38px,min(6.2vw,9.6vh),100px);letter-spacing:-.05em;line-height:1.04;margin-top:clamp(16px,2.6vh,28px)}
.hero h1 em{font-style:normal;color:var(--faint)}
.lc{display:block;overflow:hidden;padding-bottom:.16em;margin-bottom:-.16em}
.ch{display:inline-block;white-space:pre;transform:translateY(118%) rotate(10deg);transform-origin:0 100%;opacity:0;
  animation:chUp .95s var(--ease) forwards;animation-delay:calc(var(--c)*22ms + 280ms)}
@keyframes chUp{to{transform:none;opacity:1}}
.hero .go{display:inline-block;margin-top:clamp(14px,2.4vh,26px);font-size:14px;color:var(--mute);opacity:0;animation:fadeIn 1s ease 1.6s forwards}

/* edges dissolve into the page so cards glide in and out instead of popping at the screen edge */
.hero::before,.hero::after{content:'';position:absolute;top:38%;bottom:0;width:14vw;z-index:3;pointer-events:none}
.hero::before{left:0;background:linear-gradient(90deg,#fff 10%,rgba(255,255,255,0))}
.hero::after{right:0;background:linear-gradient(270deg,#fff 10%,rgba(255,255,255,0))}
.wheel{position:absolute;left:50%;top:calc(100% - var(--peek) + var(--ch)/2 + var(--R));width:0;height:0;will-change:transform}
.card{position:absolute;left:calc(var(--cw)/-2);top:calc(var(--ch)/-2);width:var(--cw);height:var(--ch);opacity:0;will-change:transform,opacity}
.card i{position:relative;display:block;width:100%;height:100%;border-radius:18px;overflow:hidden;background:var(--soft);
  box-shadow:0 2px 4px rgba(20,20,40,.05),0 22px 44px -16px rgba(20,20,40,.3);transition:transform .6s var(--ease),box-shadow .5s}
.card i::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 38%)}
.card img{width:100%;height:100%;object-fit:cover}
.card:hover i{transform:translateY(-22px) scale(1.05);box-shadow:0 4px 8px rgba(20,20,40,.06),0 40px 70px -20px rgba(20,20,40,.4)}

/* ---------- recent project: text left, image right ---------- */
.recent{padding-top:clamp(80px,10vw,150px)}
.r-split .grid{display:grid;grid-template-columns:1fr 1.5fr;gap:clamp(24px,5vw,90px);align-items:center}
.r-split h2{font-weight:600;font-size:clamp(44px,6vw,96px);letter-spacing:-.05em;line-height:1;margin:18px 0 8px}
.r-split p{color:#3d3d44;line-height:1.7;margin:20px 0 26px;max-width:44ch}
.r-split .ph{aspect-ratio:16/10.5}

/* ---------- projects: two per row ---------- */
.cat{padding-top:clamp(80px,10vw,150px)}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:clamp(44px,5vw,80px) clamp(20px,2.6vw,44px)}
@media (max-width:900px){.r-split .grid{grid-template-columns:1fr}}
@media (max-width:640px){.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="nav"></header>

<section class="hero" id="hero">
  <span class="badge">Portfolio</span>
  <h1 id="h1" aria-label="I'm Zi Wang, a visual designer and UI & UX designer.">
    <span class="lc"><em>I'm</em> Zi Wang,</span>
    <span class="lc"><em>a</em> visual designer</span>
    <span class="lc"><em>and</em> UI &amp; UX designer.</span>
  </h1>
  <a class="go ul" href="#featured">Scroll ↓</a>
  <div class="wheel" id="wheel"></div>
</section>

<div id="featured">
<section class="recent r-split wrap" data-layout="split">
  <div class="grid">
    <div class="rv"><span class="badge f-badge"></span><h2 class="f-title"></h2><span class="lbl f-sub"></span><p class="f-desc"></p><a class="more f-link">View project <b>→</b></a></div>
    <a class="rv f-link" style="--d:120ms"><div class="ph"><img class="f-img" alt=""></div></a>
  </div>
</section>
</div>

<main id="work" class="wrap"></main>
<div id="exp" class="wrap"></div>
<footer id="footer"></footer>

<script src="home.js?v=4"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)}, F=PF.featured;
  PF.chrome();
  var all$=function(q,f){[].forEach.call(document.querySelectorAll(q),f)};
  all$('.f-badge',function(e){e.textContent=F.badge}); all$('.f-img',function(e){e.src=F.img}); all$('.f-title',function(e){e.textContent=F.title});
  all$('.f-sub',function(e){e.textContent=F.sub}); all$('.f-desc',function(e){e.textContent=F.desc}); all$('.f-link',function(e){e.href=F.href});


  /* headline: split every line into characters (keeps the dimmed <em> words) */
  var c=0;
  function chars(txt){return txt.split('').map(function(ch){return '<span class="ch" aria-hidden="true" style="--c:'+(c++)+'">'+(ch===' '?' ':PF.esc(ch))+'</span>'}).join('')}
  [].forEach.call(document.querySelectorAll('.lc'),function(line){
    line.innerHTML=[].map.call(line.childNodes,function(n){return n.nodeType===3?chars(n.textContent.replace(/\s+/g,' ')):'<em>'+chars(n.textContent)+'</em>'}).join('');
    c+=6;                                             /* small pause between lines */
  });

  /* the wheel shows only the Website & Application covers, each exactly once.
     They sit a constant gap apart on a very wide circle but only fill an arc of it; a card that leaves
     on one side is carried round (off-screen) to re-enter on the other, so nothing is ever repeated. */
  var all=PF.byCat('wa'), N=all.length, wheel=$('#wheel'), hero=$('#hero'), GAP=18, R=1000, step=12, span=N*step;
  wheel.innerHTML=all.map(function(p){return '<div class="card"><i><img src="'+p.img+'"'+PF.pos(p)+' alt=""></i></div>'}).join('');
  var cards=[].slice.call(wheel.children);
  function size(){
    var cw=Math.max(180,Math.min(290,innerWidth*.17)), ch=cw*.75;
    R=30*(cw+GAP)/(2*Math.PI); step=(cw+GAP)/R*180/Math.PI; span=N*step;      /* same curvature as a 30-card wheel */
    hero.style.setProperty('--cw',cw+'px'); hero.style.setProperty('--ch',ch+'px'); hero.style.setProperty('--R',R+'px'); hero.style.setProperty('--peek',(ch*1.72)+'px');
  }
  size(); addEventListener('resize',size);

  $('#work').innerHTML=PF.cats.map(function(c){
    var list=PF.byCat(c.id);
    return '<section class="cat" id="c-'+c.id+'"><div class="sec-h rv"><h3>'+PF.esc(c.name)+'</h3><span class="lbl">'+String(list.length).padStart(2,'0')+' projects</span></div><div class="g3">'+
      list.map(function(p,i){return PF.item(p,i%2)}).join('')+'</div></section>';
  }).join('');
  PF.reveal('.rv');

  /* time-based motion: constant drift, eases down under the cursor, page scroll nudges it; cards are dealt in on load */
  var rot=0, rate=1, want=1, kick=0, lastY=scrollY, last=performance.now(), t0=last+450, SPEED=PF.reduced?0:1.9;      /* deg / second */
  var ease=function(v){v=Math.max(0,Math.min(1,v));return 1-Math.pow(1-v,4)};
  wheel.addEventListener('mouseenter',function(){want=.12}); wheel.addEventListener('mouseleave',function(){want=1});
  addEventListener('scroll',function(){kick+=(scrollY-lastY)*.02;lastY=scrollY},{passive:true});
  (function tick(now){
    var dt=Math.min(.05,(now-last)/1000); last=now;
    rate+=(want-rate)*.06; if(now>t0+1500) rot-=SPEED*rate*dt; rot-=kick*.1; kick*=.9;
    var drop=innerHeight*.34;
    cards.forEach(function(c,i){
      var a=(((i*step+rot)%span)+span)%span; if(a>span/2)a-=span;                 /* wrap into (-span/2, span/2] */
      if(Math.abs(a)>62){ if(c.style.opacity!=='0')c.style.opacity=0; return; }    /* far outside the visible arc */
      var o=PF.reduced?1:ease((now-t0-Math.abs(a)/step*45)/1700);
      c.style.transform='rotate('+(a*o).toFixed(3)+'deg) translateY('+(-R+(1-o)*drop).toFixed(1)+'px) scale('+(.5+.5*o).toFixed(3)+')';
      c.style.opacity=o.toFixed(3);
    });
    requestAnimationFrame(tick);
  })(last);
})();
</script>
</body>
</html>
