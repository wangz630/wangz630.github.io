                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-mic"
                aria-hidden="true"
              >
                <path d="M12 19v3"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <rect x="9" y="2" width="6" height="13" rx="3"></rect></svg
            ></span>
            <button class="chat-dock__launcher-send" type="submit" aria-label="Ask">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.1"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-arrow-right"
                aria-hidden="true"
              >
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
              </svg>
            </button>
          </form>
          <aside
            class="chat-dock__panel"
            role="dialog"
            aria-label="Vicino assistant"
            aria-hidden="true"
          >
            <header class="chat-dock__header">
              <span class="chat-dock__mark is-orb" aria-hidden="true"
                ><span class="vorb" aria-hidden="true" style="width: 26px; height: 26px"
                  ><span class="vorb__halo"></span><span class="vorb__core"></span></span></span
              ><span class="chat-dock__title-group"
                ><span class="chat-dock__title">Vicino</span
                ><span class="chat-dock__subtitle">Guided tour — first campaign</span></span
              ><button
                class="chat-dock__header-button"
                type="button"
                aria-label="Help &amp; support"
                title="Help &amp; support"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-circle-question-mark"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                  <path d="M12 17h.01"></path>
                </svg></button
              ><button
                class="chat-dock__header-button"
                type="button"
                aria-label="Show conversations"
                title="Show conversations"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-list"
                  aria-hidden="true"
                >
                  <path d="M3 5h.01"></path>
                  <path d="M3 12h.01"></path>
                  <path d="M3 19h.01"></path>
                  <path d="M8 5h13"></path>
                  <path d="M8 12h13"></path>
                  <path d="M8 19h13"></path>
                </svg></button
              ><button
                class="chat-dock__header-button"
                type="button"
                aria-label="Expand to fullscreen"
                title="Fullscreen"
                aria-pressed="false"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-maximize2 lucide-maximize-2"
                  aria-hidden="true"
                >
                  <path d="M15 3h6v6"></path>
                  <path d="m21 3-7 7"></path>
                  <path d="m3 21 7-7"></path>
                  <path d="M9 21H3v-6"></path>
                </svg></button
              ><button
                class="chat-dock__header-button"
                type="button"
                aria-label="Close Vicino assistant"
                title="Close"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-x"
                  aria-hidden="true"
                >
                  <path d="M18 6 6 18"></path>
                  <path d="m6 6 12 12"></path>
                </svg>
              </button>
            </header>
            <div
              class="chat-dock__announcement"
              role="status"
              aria-live="polite"
              aria-atomic="true"
              aria-label="Latest response from Vicino"
            ></div>
            <div
              class="chat-dock__body"
              role="log"
              aria-live="off"
              aria-label="Conversation with Vicino"
            >
              <div class="chat-dock__loading">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-loader-circle"
                  aria-hidden="true"
                >
                  <path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg
                ><span>Loading conversation…</span>
              </div>
            </div>
            <footer class="chat-dock__compose">
              <form class="chat-dock__form" autocomplete="off">
                <div class="chat-dock__composer">
                  <span class="chat-dock__icon is-orb" aria-hidden="true"
                    ><span class="vorb" aria-hidden="true" style="width: 26px; height: 26px"
                      ><span class="vorb__halo"></span><span class="vorb__core"></span></span></span
                  ><textarea
                    class="chat-dock__input"
                    rows="1"
                    placeholder="Ask Vicino…"
                    aria-label="Ask Vicino"
                    style="height: 34px; overflow-y: hidden"
                  ></textarea
                  ><button class="chat-dock__tool" type="button" aria-label="Attach file">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-paperclip"
                      aria-hidden="true"
                    >
                      <path
                        d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"
                      ></path>
                    </svg></button
                  ><button
                    class="chat-dock__send"
                    type="submit"
                    aria-label="Send message"
                    disabled=""
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="17"
                      height="17"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.4"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-arrow-up"
                      aria-hidden="true"
                    >
                      <path d="m5 12 7-7 7 7"></path>
                      <path d="M12 19V5"></path>
                    </svg>
                  </button>
                </div>
                <input
                  aria-label="Attach a file to the message"
                  class="chat-dock__file-input"
                  type="file"
                  multiple=""
                  accept=".pdf,.txt,.md,.markdown,.csv,.json,.html,.htm,.png,.jpg,.jpeg,application/pdf,application/json,text/*,image/png,image/jpeg"
                />
              </form>
            </footer>
          </aside>
        </div>
        <div id="bx-switcher" class="bx-sw"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <script src="./src/keywords.js"></script>
    <script src="./src/shared-bx.js"></script>
    <script src="./src/profile-view.js"></script>
    <script src="./src/answer-data.js"></script>
    <script src="./src/answer.js"></script>
    <script src="./src/brain-fields.js"></script>
    <script src="./src/brain-fields-view.js"></script>
    <script src="./src/roadmap-views.js"></script>
    <script src="./src/view-f.js"></script>
    <script src="./src/view-library.js"></script>
    <script src="./src/chat.js"></script>
    <script src="./src/pages-data.js"></script>
    <script src="./src/pages.js"></script>

    <script src="./src/main.js"></script>
  </body>
